<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ToolGuest — Create Your Online Store. Sell Anywhere.</title>
<meta name="description" content="ToolGuest is the simplest way to create your online store. Upload products, share your link, and start receiving orders — no technical skills needed."/>
<style>
:root{
  --ink:#0B0B10; --ink2:#3A3A46; --muted:#71717F;
  --line:#E9E9EE; --line2:#F2F2F5;
  --bg:#FFFFFF; --surface:#FAFAFB; --surface2:#F5F5F7;
  --accent:#4F46E5; --accent2:#6D67F0; --accent-soft:#EEEDFE; --accent-ink:#3730C4;
  --ok:#0E9F6E; --ok-soft:#E7F7F0;
  --warn:#B45309; --warn-soft:#FEF3E2;
  --danger:#DC2626; --danger-soft:#FEECEC;
  --r:14px; --r-sm:10px; --r-lg:20px;
  --sh-sm:0 1px 2px rgba(16,16,30,.05);
  --sh:0 1px 2px rgba(16,16,30,.05),0 10px 28px -16px rgba(16,16,30,.22);
  --sh-lg:0 30px 70px -30px rgba(16,16,30,.32);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
.wrap-sm{max-width:760px;margin:0 auto;padding:0 22px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:11px;
  border:1px solid transparent;background:var(--surface2);font-weight:600;font-size:14.5px;cursor:pointer;
  transition:transform .14s ease,background .16s ease,box-shadow .16s ease,border-color .16s ease;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.3),0 10px 24px -14px rgba(79,70,229,.9)}
.btn-primary:hover{background:#443BDA}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-outline:hover{background:var(--surface);border-color:#DADAE0}
.btn-ghost{background:transparent;color:var(--ink2)}
.btn-ghost:hover{background:var(--surface2)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:#FBDDDD}
.btn-sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:9px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:26px;height:66px}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:-.03em;font-size:17.5px}
.brand-mark{width:29px;height:29px;border-radius:9px;background:linear-gradient(145deg,#6D67F0,#3B32D4);
  display:grid;place-items:center;box-shadow:0 4px 12px -5px rgba(79,70,229,.85)}
.brand-mark svg{width:16px;height:16px}
.nav-links{display:flex;gap:4px;margin-left:6px}
.nav-links a{padding:8px 12px;border-radius:9px;font-size:14.5px;font-weight:550;color:var(--ink2);transition:background .15s,color .15s}
.nav-links a:hover{background:var(--surface2);color:var(--ink)}
.nav-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-toggle{display:none;margin-left:auto;background:none;border:0;padding:8px;cursor:pointer}

/* ---------- hero ---------- */
.hero{padding:76px 0 40px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-30% -10% auto -10%;height:620px;
  background:radial-gradient(60% 60% at 70% 20%,rgba(109,103,240,.16),transparent 70%),
             radial-gradient(50% 50% at 15% 0%,rgba(14,159,110,.09),transparent 70%);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;
  background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);box-shadow:var(--sh-sm)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.display{font-size:clamp(34px,5.1vw,57px);line-height:1.06;letter-spacing:-.035em;font-weight:750;margin-top:20px}
.display .hl{position:relative;white-space:nowrap;background:linear-gradient(100deg,#4F46E5,#7C6BF5 55%,#0E9F6E);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:17px;line-height:1.62;margin-top:18px;max-width:520px}
.hero-cta{display:flex;gap:11px;margin-top:28px;flex-wrap:wrap}
.trust{display:flex;align-items:center;gap:16px;margin-top:22px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.trust span{display:inline-flex;align-items:center;gap:6px}
.tick{width:15px;height:15px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:9px;font-weight:800}

/* store preview mock */
.mock{position:relative}
.mock-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh-lg);overflow:hidden}
.mock-top{display:flex;align-items:center;gap:7px;padding:12px 15px;border-bottom:1px solid var(--line2);background:var(--surface)}
.mock-top i{width:9px;height:9px;border-radius:50%;background:#E2E2E8;display:block}
.mock-url{margin-left:8px;font-size:11.5px;color:var(--muted);background:#fff;border:1px solid var(--line);
  border-radius:7px;padding:3px 10px;flex:1;text-align:center;font-weight:500}
.mock-body{padding:16px}
.mock-hero{height:78px;border-radius:12px;background:linear-gradient(120deg,#EEEDFE,#E7F7F0 70%);display:flex;
  align-items:center;padding:0 16px;gap:10px}
.mock-ava{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#6D67F0,#3B32D4);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:14px}
.mock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
.mock-prod{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.mock-prod .ph{height:62px;background:linear-gradient(140deg,#EDEDF5,#F7F7FA)}
.mock-prod .ph.b{background:linear-gradient(140deg,#E9F6F1,#F6FBF9)}
.mock-prod .ph.c{background:linear-gradient(140deg,#FDF1E7,#FEF8F3)}
.mock-prod .tx{padding:6px 7px}
.mock-prod .tx b{display:block;height:5px;width:76%;background:#EDEDF2;border-radius:3px}
.mock-prod .tx i{display:block;height:5px;width:42%;background:#E4E4EC;border-radius:3px;margin-top:5px}
.mock-badge{position:absolute;right:-14px;bottom:-16px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:11px 15px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px}
.mock-badge .ic{width:32px;height:32px;border-radius:10px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-weight:800}
.mock-badge b{display:block;font-size:13px;letter-spacing:-.01em}
.mock-badge small{color:var(--muted);font-size:11.5px}

/* ---------- sections ---------- */
.section{padding:78px 0}
.section.alt{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.section-head{max-width:620px;margin:0 auto 46px;text-align:center}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.h2{font-size:clamp(25px,3.4vw,36px);letter-spacing:-.03em;line-height:1.16;font-weight:730;margin-top:11px}
.sub{color:var(--muted);margin-top:13px;font-size:15.5px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm)}
.step{padding:26px 24px;position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);transition:box-shadow .2s,transform .2s}
.step:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.step-n{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:grid;
  place-items:center;font-weight:800;font-size:14px;margin-bottom:15px}
.step h3{font-size:16.5px;letter-spacing:-.015em;margin-bottom:7px}
.step p{color:var(--muted);font-size:14.2px;line-height:1.6}
.feature{padding:24px;border-radius:var(--r);border:1px solid var(--line);background:#fff;transition:box-shadow .2s,transform .2s}
.feature:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.feature .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);
  display:grid;place-items:center;margin-bottom:15px}
.feature .ic svg{width:19px;height:19px}
.feature h3{font-size:15.5px;letter-spacing:-.015em;margin-bottom:6px}
.feature p{color:var(--muted);font-size:14px;line-height:1.6}

.benefits{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center}
.benefit-list{display:grid;gap:16px;margin-top:26px}
.bl{display:flex;gap:13px;align-items:flex-start}
.bl .tick2{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;
  place-items:center;font-size:11px;font-weight:800;margin-top:2px}
.bl b{display:block;font-size:15px;letter-spacing:-.01em}
.bl span{color:var(--muted);font-size:14px}
.stat-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;box-shadow:var(--sh)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line2);font-size:14px}
.stat-row:last-child{border-bottom:0}
.stat-row b{font-size:19px;letter-spacing:-.02em}

/* pricing */
.price-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;position:relative;transition:box-shadow .2s,transform .2s}
.price-card:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.price-card.pop{border-color:#CFCBFA;box-shadow:0 0 0 3px var(--accent-soft),var(--sh)}
.pop-tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;
  font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 12px;border-radius:999px;text-transform:uppercase}
.price-card h3{font-size:15px;letter-spacing:-.01em}
.price-card .amt{font-size:33px;font-weight:760;letter-spacing:-.035em;margin:9px 0 3px}
.price-card .amt small{font-size:13.5px;font-weight:600;color:var(--muted);letter-spacing:0}
.price-card .pd{color:var(--muted);font-size:13.5px;min-height:38px}
.plist{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:9px}
.plist li{display:flex;gap:9px;font-size:13.7px;color:var(--ink2);align-items:flex-start}
.plist .tick{flex:none;margin-top:3px}

/* faq */
.faq{max-width:760px;margin:0 auto}
details{border-bottom:1px solid var(--line);padding:4px 0}
details summary{cursor:pointer;list-style:none;padding:16px 30px 16px 0;font-weight:600;font-size:15px;position:relative;letter-spacing:-.01em}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--muted);
  font-size:19px;font-weight:400;transition:transform .2s}
details[open] summary::after{content:"−"}
details p{color:var(--muted);font-size:14.3px;padding:0 30px 18px 0;margin-top:-4px}

/* footer */
.footer{border-top:1px solid var(--line);background:var(--surface);padding:56px 0 30px}
.f-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:36px}
.f-brand p{color:var(--muted);font-size:13.8px;margin-top:12px;max-width:270px}
.f-col h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:13px;font-weight:700}
.f-col a{display:block;padding:5px 0;font-size:14px;color:var(--ink2)}
.f-col a:hover{color:var(--accent)}
.f-bottom{margin-top:42px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* forms */
.field{margin-bottom:15px}
.label{display:block;font-size:13.2px;font-weight:600;margin-bottom:6px;color:var(--ink2);letter-spacing:-.005em}
.input,select.input,textarea.input{width:100%;height:44px;padding:0 13px;border:1px solid var(--line);border-radius:11px;
  background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;font-size:14.5px}
textarea.input{height:auto;padding:11px 13px;resize:vertical;min-height:92px;line-height:1.55}
.input:focus{border-color:#B9B4F6;box-shadow:0 0 0 3.5px rgba(79,70,229,.13)}
.input::placeholder{color:#A7A7B4}
.hint{font-size:12.4px;color:var(--muted);margin-top:6px}
.err{font-size:12.6px;color:var(--danger);margin-top:6px;display:none}
.err.show{display:block}

.auth-wrap{min-height:calc(100vh - 66px);display:grid;place-items:center;padding:48px 20px;background:
  radial-gradient(60% 50% at 50% 0%,rgba(109,103,240,.10),transparent 70%)}
.auth-card{width:100%;max-width:432px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  padding:32px;box-shadow:var(--sh)}
.auth-card h1{font-size:24px;letter-spacing:-.03em;font-weight:730}
.auth-card .sub{margin-top:7px;font-size:14.2px}
.auth-foot{text-align:center;font-size:13.8px;color:var(--muted);margin-top:18px}

/* dashboard */
.dash{display:grid;grid-template-columns:236px 1fr;gap:30px;padding:30px 0 70px;align-items:start}
.side{position:sticky;top:92px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:9px;box-shadow:var(--sh-sm)}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:14.2px;font-weight:550;
  color:var(--ink2);transition:background .15s,color .15s;margin-bottom:1px}
.side a:hover{background:var(--surface2)}
.side a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:650}
.side a svg{width:16px;height:16px;opacity:.75}
.side a.on svg{opacity:1}
.side-sep{height:1px;background:var(--line2);margin:8px 4px}
.dash-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.dash-head h1{font-size:25px;letter-spacing:-.03em;font-weight:730}
.dash-head p{color:var(--muted);font-size:14px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;box-shadow:var(--sh-sm)}
.stat .k{font-size:12.6px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.stat .v{font-size:26px;font-weight:760;letter-spacing:-.035em;margin-top:6px}
.stat .v.small{font-size:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:15.5px;letter-spacing:-.015em;font-weight:680}
.panel-body{padding:20px}

/* dropzone */
.drop{border:1.5px dashed #D6D6E0;border-radius:var(--r);padding:30px 18px;text-align:center;background:var(--surface);
  cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;
  place-items:center;margin:0 auto 11px;color:var(--accent)}
.drop b{font-size:14.5px;display:block}
.drop span{font-size:12.8px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:11px;margin-top:14px}
.thumb{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{position:absolute;top:5px;right:5px;width:23px;height:23px;border-radius:50%;background:rgba(11,11,16,.72);
  color:#fff;border:0;cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center}
.thumb .rm:hover{background:var(--danger)}
.thumb .cover{position:absolute;bottom:5px;left:5px;background:rgba(255,255,255,.94);font-size:10.5px;font-weight:700;
  padding:2px 7px;border-radius:6px;color:var(--ink2)}

/* product cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:18px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:box-shadow .2s,transform .2s;display:flex;flex-direction:column}
.pcard:hover{box-shadow:var(--sh);transform:translateY(-3px)}
.pcard .img{aspect-ratio:1;background:var(--surface2);overflow:hidden}
.pcard .img img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.pcard:hover .img img{transform:scale(1.045)}
.pcard .body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard h3{font-size:14.4px;font-weight:640;letter-spacing:-.012em;line-height:1.35}
.pcard .price{font-size:15.5px;font-weight:750;letter-spacing:-.02em;margin-top:2px}
.pcard .cat{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.pcard .actions{margin-top:auto;padding-top:11px;display:flex;gap:7px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:7px;font-size:11.6px;
  font-weight:700;letter-spacing:.015em;background:var(--surface2);color:var(--ink2)}
.badge.ok{background:var(--ok-soft);color:#0A7A55}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.dan{background:var(--danger-soft);color:var(--danger)}
.badge.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* table */
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11.9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:700;padding:11px 16px;border-bottom:1px solid var(--line2);background:var(--surface)}
.table td{padding:14px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tr:hover td{background:#FCFCFD}

/* store front */
.store-hero{background:linear-gradient(150deg,#F3F2FE,#EAF7F2 60%,#FDF4EC);border-bottom:1px solid var(--line);padding:44px 0 40px}
.store-brand{display:flex;align-items:center;gap:16px}
.store-logo{width:60px;height:60px;border-radius:17px;background:linear-gradient(145deg,#6D67F0,#3B32D4);color:#fff;
  display:grid;place-items:center;font-size:24px;font-weight:750;box-shadow:0 10px 24px -12px rgba(79,70,229,.9)}
.store-brand h1{font-size:clamp(24px,3.4vw,32px);letter-spacing:-.032em;font-weight:750}
.store-brand p{color:var(--ink2);font-size:14.4px;margin-top:2px;opacity:.85}
.store-toolbar{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:210px}
.search input{width:100%;height:44px;padding:0 14px 0 40px;border-radius:11px;border:1px solid var(--line);background:#fff;outline:none;font-size:14.5px}
.search input:focus{border-color:#B9B4F6;box-shadow:0 0 0 3.5px rgba(79,70,229,.13)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0 24px}
.chip{height:33px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.2px;
  font-weight:600;cursor:pointer;color:var(--ink2);transition:.15s}
.chip:hover{border-color:#D5D5DF}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* product detail */

/* image compression on upload */
function fileToDataURL(file, max = 900){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.78));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function dashShell(active, content){
  const u = currentUser();
  const s = storeOf(u);
  const items = [
    ['overview','Overview', ICON.home, '#/dashboard'],
    ['add','Add Product', ICON.plus, '#/dashboard/add'],
    ['products','My Products', ICON.list, '#/dashboard/products'],
    ['orders','Orders', ICON.cart, '#/dashboard/orders'],
    ['store','My Store', ICON.store, '#/dashboard/store'],
    ['settings','Store Settings', ICON.settings, '#/dashboard/settings']
  ];
  return nav()
  + '<div class="wrap"><div class="dash">'
  + '<aside class="side">'
  + items.map(i => '<a href="' + i[3] + '" class="' + (active === i[0] ? 'on' : '') + '">' + i[2] + i[1] + '</a>').join('')
  + '<div class="side-sep"></div>'
  + '<a href="#/store/' + esc(s ? s.slug : '') + '">' + ICON.link + 'View public store</a>'
  + '</aside>'
  + '<main>' + content + '</main>'
  + '</div></div>' + footer();
}

function viewOverview(){
  const u = currentUser(); const s = storeOf(u);
  if (!s) return dashShell('overview', emptyState('No store yet','Your store was not created. Please contact support.'));
  const ps = productsOf(s.id);
  const os = orders().filter(o => o.storeId === s.id);
  const pending = os.filter(o => o.status === 'Pending').length;
  const sales = os.filter(o => o.status !== 'Cancelled').reduce((a,o) => a + o.total, 0);

  const content =
    '<div class="dash-head"><div><h1>Overview</h1><p>Here\'s how ' + esc(s.name) + ' is doing.</p></div>'
    + '<a class="btn btn-primary btn-sm" href="#/dashboard/add">+ Add product</a></div>'
    + '<div class="stats">'
    + '<div class="stat"><div class="k">Total products</div><div class="v">' + ps.length + '</div></div>'
    + '<div class="stat"><div class="k">Total orders</div><div class="v">' + os.length + '</div></div>'
    + '<div class="stat"><div class="k">Pending orders</div><div class="v">' + pending + '</div></div>'
    + '<div class="stat"><div class="k">Total sales</div><div class="v small">' + money(sales) + '</div></div>'
    + '</div>'
    + '<div class="panel"><div class="panel-head"><h2>Recent orders</h2>'
    + '<a class="link small" href="#/dashboard/orders">View all</a></div>'
    + (os.length ? ordersTable(os.slice(0,5), true) : emptyState('No orders yet','Share your store link to start receiving orders.','Share your store', '#/dashboard/store'))
    + '</div>'
    + '<div class="panel mt-3"><div class="panel-head"><h2>Your store link</h2></div><div class="panel-body">'
    + '<div class="copybox"><input readonly value="' + esc(storeUrl(s.slug)) + '"><button class="btn btn-sm btn-outline" data-act="copy" data-url="' + esc(storeUrl(s.slug)) + '">Copy</button></div>'
    + '<div class="row mt-2"><a class="btn btn-sm btn-outline" href="#/dashboard/store">Share options</a>'
    + '<a class="btn btn-sm btn-outline" href="#/store/' + esc(s.slug) + '">Preview store</a></div>'
    + '</div></div>';
  return dashShell('overview', content);
}

function storeUrl(slug){ return location.origin + location.pathname + '#/store/' + slug; }
function prettyUrl(slug){ return 'toolguest.com/store/' + slug; }

function emptyState(title, text, cta, href){
  return '<div class="empty"><div class="ic">' + ICON.box + '</div><b>' + title + '</b><p>' + text + '</p>'
    + (cta ? '<div class="mt-3"><a class="btn btn-primary btn-sm" href="' + href + '">' + cta + '</a></div>' : '') + '</div>';
}

function ordersTable(list, compact){
  return '<table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th>'
    + (compact ? '' : '<th>Placed</th>') + '</tr></thead><tbody>'
    + list.map(o =>
      '<tr><td data-l="Order"><a class="link mono" href="#/order/' + o.id + '">' + esc(o.orderNo) + '</a></td>'
      + '<td data-l="Customer">' + esc(o.customer.name) + '<div class="muted small">' + esc(o.customer.mobile) + '</div></td>'
      + '<td data-l="Items">' + o.items.reduce((a,i) => a + i.qty, 0) + '</td>'
      + '<td data-l="Total"><b>' + money(o.total) + '</b></td>'
      + '<td data-l="Status">' + statusBadge(o.status) + '</td>'
      + (compact ? '' : '<td data-l="Placed">' + fmtDateTime(o.createdAt) + '</td>')
      + '</tr>').join('')
    + '</tbody></table>';
}

function viewStore(slug){

  const q = storeQuery.toLowerCase();

  return storeHeader(s)

  + '<div class="row-center" style="justify-content:space-between;margin-top:14px"><span class="muted">Total</span>'
  + '<b style="font-size:18px">' + money(o.total) + '</b></div>'
  + '<div class="mt-3" style="border-top:1px solid var(--line2);padding-top:16px">'
  + '<div class="muted small" style="font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Delivery to</div>'
  + '<div style="font-weight:600">' + esc(o.customer.name) + ' · ' + esc(o.customer.mobile) + '</div>'
  + '<div class="muted small" style="line-height:1.6">' + esc(o.customer.address) + '<br>' + esc(o.customer.city) + ', ' + esc(o.customer.state) + ' — ' + esc(o.customer.pin) + '</div>'
  + '</div></div></div>'
  + '<div class="row mt-3"><a class="btn btn-outline" style="flex:1" href="#/store/' + esc(s ? s.slug : '') + '">Continue shopping</a>'
  + '<a class="btn btn-primary" style="flex:1" href="#/order/' + o.id + '">Track order</a></div>'
  + '</div>' + footer();
}

function viewTrackOrder(oid){
  const o = orders().find(x => x.id === oid);
  if (!o) return nav() + '<div class="wrap" style="padding:50px 22px">' + emptyState('Order not found','Check your order link.','Home','#/') + '</div>' + footer();
  const idx = STATUSES.indexOf(o.status);
  return nav()
  + '<div class="wrap-sm" style="padding:40px 22px 80px">'
  + '<a class="link small" href="#/order/' + o.id + '">← Order summary</a>'
  + '<h1 class="h2 mt-2" style="font-size:26px">Order ' + esc(o.orderNo) + '</h1>'
  + '<p class="sub">Placed on ' + fmtDateTime(o.createdAt) + '</p>'
  + '<div class="panel mt-3"><div class="panel-body">'
  + STATUSES.slice(0,5).map((st,i) =>
      '<div class="row-center" style="padding:10px 0;gap:12px">'
      + '<div style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;'
      + (o.status === 'Cancelled' ? 'background:var(--surface2);color:#A7A7B4'
         : i <= idx ? 'background:var(--ok-soft);color:var(--ok)' : 'background:var(--surface2);color:#A7A7B4') + '">'
      + (i <= idx && o.status !== 'Cancelled' ? '✓' : (i+1)) + '</div>'
      + '<div style="font-weight:' + (i === idx ? '700' : '500') + ';font-size:14.2px">' + st + '</div></div>').join('')
  + (o.status === 'Cancelled' ? '<div class="badge dan mt-2">Order cancelled</div>' : '')
  + '</div></div>'
  + '<div class="panel mt-3"><div class="panel-body">'
  + '<div class="row-center" style="justify-content:space-between"><span class="muted small">Payment status</span>' + payBadge(o.paymentStatus) + '</div>'
  + '<div class="row-center mt-2" style="justify-content:space-between"><span class="muted small">Total</span><b>' + money(o.total) + '</b></div>'
  + '</div></div>'
  + '</div>' + footer();
}

/* ============================================================
   ADMIN
   ============================================================ */
function viewAdmin(){
  const u = currentUser();
  if (!u || u.role !== 'admin'){
    return nav() + '<div class="auth-wrap"><div class="auth-card">'
      + '<h1>Admin access</h1><p class="sub">This panel is restricted to platform administrators.</p>'
      + '<div class="note blue mt-3" style="font-size:13px">Demo credentials: <b>admin@toolguest.com</b> / <b>admin1234</b></div>'
      + '<a class="btn btn-primary btn-block mt-3" href="#/login">Log in as admin</a>'
      + '</div></div>';
  }
  const allStores = stores(), allProducts = products(), allOrders = orders(), allUsers = users().filter(x => x.role === 'seller');
  const gmv = allOrders.filter(o => o.status !== 'Cancelled').reduce((a,o) => a + o.total, 0);
  const content =
    '<div class="dash-head"><div><h1>Platform overview</h1><p>Everything happening across ToolGuest.</p></div></div>'
    + '<div class="stats">'
    + '<div class="stat"><div class="k">Sellers</div><div class="v">' + allUsers.length + '</div></div>'
    + '<div class="stat"><div class="k">Stores</div><div class="v">' + allStores.length + '</div></div>'
    + '<div class="stat"><div class="k">Products</div><div class="v">' + allProducts.length + '</div></div>'
    + '<div class="stat"><div class="k">Orders</div><div class="v">' + allOrders.length + '</div></div>'
    + '</div>'
    + '<div class="panel mb-2"><div class="panel-head"><h2>GMV</h2></div><div class="panel-body">'
    + '<div style="font-size:30px;font-weight:770;letter-spacing:-.035em">' + money(gmv) + '</div>'
    + '<div class="muted small">Across all stores, excluding cancelled orders.</div></div></div>'
    + '<div class="panel"><div class="panel-head"><h2>Sellers &amp; stores</h2></div>'
    + '<table class="table"><thead><tr><th>Seller</th><th>Store</th><th>Products</th><th>Orders</th><th>Status</th></tr></thead><tbody>'
    + allUsers.map(su => {
        const st = allStores.find(x => x.ownerId === su.id);
        const pc = st ? productsOf(st.id).length : 0;
        const oc = st ? orders().filter(o => o.storeId === st.id).length : 0;
        return '<tr><td data-l="Seller"><div style="font-weight:620">' + esc(su.name) + '</div><div class="muted small">' + esc(su.email) + '</div></td>'
          + '<td data-l="Store">' + (st ? '<a class="link" href="#/store/' + esc(st.slug) + '">' + esc(st.name) + '</a>' : '<span class="muted">—</span>') + '</td>'
          + '<td data-l="Products">' + pc + '</td><td data-l="Orders">' + oc + '</td>'
          + '<td data-l="Status"><span class="badge ok">Active</span></td></tr>';
      }).join('')
    + '</tbody></table></div>'
    + '<div class="panel mt-3"><div class="panel-head"><h2>Recent orders</h2></div>'
    + (allOrders.length
        ? ordersTable(allOrders.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,10), false)
        : emptyState('No orders yet','Platform orders will appear here.'))
    + '</div>';
  return dashShell('overview', content).replace(/<aside class="side">[\s\S]*?<\/aside>/, '<aside class="side">'
    + '<a href="#/dashboard" class="on">' + ICON.chart + 'Overview</a>'
    + '<a href="#/admin">' + ICON.store + 'All stores</a>'
    + '</aside>');
}

/* ============================================================
   ACTION HANDLERS
   ============================================================ */
const actions = {
  logout(){ db.del('session'); toast('Logged out'); location.hash = '#/'; },

  copy(el){ const url = el.dataset.url;
    navigator.clipboard?.writeText(url).then(()=>toast('Link copied'), ()=>toast('Copy failed — select and copy manually'));
  },

  ighelp(){ alert('Instagram sharing:\n\n1. Copy your store link from the Copy button.\n2. Open Instagram → your profile → Edit Profile.\n3. Paste the link in the Website field.\n4. Also add it to your bio or story link sticker.'); },

  gal(el){ const i = +el.dataset.i; window._gal = i;
    const main = document.getElementById('galMain');
    if (main) main.src = draft && draft.images ? draft.images[i] : main.src;
    document.querySelectorAll('.gallery-thumbs button').forEach((b,bi) => b.classList.toggle('on', bi === i));
  },

  rmimg(el){ const i = +el.dataset.i; draft.images.splice(i,1);
    document.getElementById('thumbs').innerHTML = thumbsHtml(draft.images); },

  editprod(el){ const id = el.dataset.id; resetDraft(id); location.hash = '#/dashboard/add'; },

  togglepub(el){
    const all = products(); const p = all.find(x => x.id === el.dataset.id);
    if (!p) return; p.published = !p.published; db.set('products', all);
    toast(p.published ? 'Product published' : 'Product moved to draft'); render();
  },

  delprod(el){
    if (!confirm('Delete this product permanently?')) return;
    db.set('products', products().filter(x => x.id !== el.dataset.id));
    toast('Product deleted'); render();
  },

  ofilter(el){ window._orderFilter = el.dataset.st; render(); },

  addcart(el){
    const p = products().find(x => x.id === el.dataset.pid);
    if (!p) return;
    const cart = getCart(p.storeId);
    const ex = cart.find(i => i.id === p.id);
    if (ex) ex.qty += 1;
    else cart.push({ id:p.id, title:p.title, price:p.price, image:p.images[0], qty:1 });
    setCart(p.storeId, cart);
    toast('Added to cart');
    const store = stores().find(s => s.id === p.storeId);
    if (location.hash.indexOf('/p/') > -1) { render(); }
    else if (store) location.hash = '#/store/' + store.slug;
  },

  buynow(el){
    const p = products().find(x => x.id === el.dataset.pid);
    if (!p) return;
    const cart = getCart(p.storeId);
    const ex = cart.find(i => i.id === p.id);
    const qty = +(document.getElementById('qtyVal')?.textContent || 1);
    if (ex) ex.qty = qty; else cart.push({ id:p.id, title:p.title, price:p.price, image:p.images[0], qty });
    setCart(p.storeId, cart);
    const store = stores().find(s => s.id === p.storeId);
    location.hash = '#/checkout/' + store.slug;
  },

  qinc(){ const e = document.getElementById('qtyVal'); e.textContent = +e.textContent + 1; },
  qdec(){ const e = document.getElementById('qtyVal'); e.textContent = Math.max(1, +e.textContent - 1); },

  cinc(el){ const pid = el.dataset.pid; const s = stores().find(x => productsOf(x.id).some(p => p.id === pid));
    if (!s) return; const cart = getCart(s.id); const it = cart.find(i => i.id === pid);
    if (it) { it.qty++; setCart(s.id, cart); render(); } },
  cdec(el){ const pid = el.dataset.pid; const s = stores().find(x => productsOf(x.id).some(p => p.id === pid));
    if (!s) return; const cart = getCart(s.id); const it = cart.find(i => i.id === pid);
    if (it) { it.qty = Math.max(1, it.qty - 1); setCart(s.id, cart); render(); } },
  cremove(el){ const pid = el.dataset.pid; const s = stores().find(x => productsOf(x.id).some(p => p.id === pid));
    if (!s) return; setCart(s.id, getCart(s.id).filter(i => i.id !== pid)); render(); }
};

/* delegated clicks */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'storeq' || act === 'storecat') return;
  if (actions[act]) { e.preventDefault(); actions[act](t, e); }
});

/* store search & category */
document.addEventListener('input', e => {
  if (e.target.matches('[data-act="storeq"]')){
    storeQuery = e.target.value;
    const v = e.target.value;
    render();
    const inp = document.querySelector('[data-act="storeq"]');

});
document.addEventListener('click', e => {

});

/* order status select */
document.addEventListener('change', e => {
  const sel = e.target.closest('[data-act="setstatus"]');
  if (!sel) return;
  const all = orders(); const o = all.find(x => x.id === sel.dataset.id);

/* forms */
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const type = f.dataset.form;
  const data = Object.fromEntries(new FormData(f).entries());

  if (type === 'login'){
    const u = users().find(x => x.email.toLowerCase() === (data.email||'').toLowerCase().trim());
    const err = document.getElementById('loginErr');
    if (!u || u.pw !== btoa(data.password)){
      err.textContent = 'Incorrect email or password.'; err.classList.add('show'); return;
    }
    db.set('session', u.id);
    toast('Welcome back, ' + u.name.split(' ')[0]);
    location.hash = u.role === 'admin' ? '#/admin' : '#/dashboard';
    return;
  }

  if (type === 'signup'){
    const err = document.getElementById('signupErr');
    const fail = m => { err.textContent = m; err.classList.add('show'); };
    const email = (data.email||'').toLowerCase().trim();
    const slug = (data.slug||'').toLowerCase().trim();
    if (users().some(u => u.email.toLowerCase() === email)) return fail('An account with this email already exists.');
    if (!/^[a-z0-9][a-z0-9-]{2,29}$/.test(slug)) return fail('Store link must be 3–30 characters: lowercase letters, numbers or hyphens.');
    if (stores().some(s => s.slug === slug)) return fail('That store link is already taken. Try another.');
    const user = { id: uid('u_'), name: data.name.trim(), email, pw: btoa(data.password), role:'seller', createdAt: now() };
    const store = { id: uid('s_'), ownerId: user.id, slug, name: data.storeName.trim(), tagline:'', about:'', whatsapp:'', createdAt: now() };
    db.set('users', [...users(), user]);
    db.set('stores', [...stores(), store]);
    db.set('session', user.id);
    toast('Your store is live 🎉');
    location.hash = '#/dashboard';
    return;
  }

  if (type === 'forgot'){
    toast('If that email exists, a reset link has been sent.');
    location.hash = '#/login';
    return;
  }

  if (type === 'contact'){
    toast('Message sent — we\'ll reply within 24 hours.');
    f.reset();
    return;
  }

  if (type === 'product'){
    const err = document.getElementById('prodErr');
    const fail = m => { err.textContent = m; err.classList.add('show'); };
    if (!draft.images.length) return fail('Add at least one product image.');
    if (!data.title.trim()) return fail('Product title is required.');
    if (!data.price || +data.price <= 0) return fail('Enter a valid price.');
    if (!data.desc.trim()) return fail('Add a short description.');

    const u = currentUser(); const s = storeOf(u);
    const all = products();
    if (draft.id){
      const i = all.findIndex(x => x.id === draft.id);
      all[i] = { ...all[i], title:data.title.trim(), price:+data.price, desc:data.desc.trim(),
                 category:data.category, images:draft.images };
      db.set('products', all);
      toast('Product updated');
    } else {
      all.push({ id: uid('p_'), storeId: s.id, title:data.title.trim(), price:+data.price,
                 desc:data.desc.trim(), category:data.category, images:draft.images,
                 published:true, createdAt: now() });
      db.set('products', all);
      toast('Product published to your store');
    }
    draft = null;
    location.hash = '#/dashboard/products';
    return;
  }

  if (type === 'settings'){
    const err = document.getElementById('setErr');
    const fail = m => { err.textContent = m; err.classList.add('show'); };
    const slug = (data.slug||'').toLowerCase().trim();
    if (!/^[a-z0-9][a-z0-9-]{2,29}$/.test(slug)) return fail('Store link must be 3–30 characters: lowercase letters, numbers or hyphens.');
    if (stores().some(s => s.slug === slug && s.ownerId !== currentUser().id)) return fail('That store link is already taken.');
    const all = stores(); const s = all.find(x => x.ownerId === currentUser().id);
    Object.assign(s, { name:data.name.trim(), slug, tagline:data.tagline.trim(),
                       about:data.about.trim(), whatsapp:data.whatsapp.trim() });
    db.set('stores', all);
    toast('Store settings saved');
    render();
    return;
  }

  if (type === 'checkout'){
    const err = document.getElementById('checkoutErr');
    const fail = m => { err.textContent = m; err.classList.add('show'); };
    if (!/^[0-9+\- ]{10,15}$/.test(data.mobile.trim())) return fail('Enter a valid mobile number.');
    if (!/^[0-9]{6}$/.test(data.pin.trim())) return fail('Enter a valid 6-digit PIN code.');
    if (!data.name.trim() || !data.address.trim() || !data.city.trim() || !data.state.trim()) return fail('Please fill in all delivery fields.');

    const s = storeBySlug(location.hash.split('/')[2]);
    const cart = getCart(s.id);
    if (!cart.length) return fail('Your cart is empty.');

    const order = {
      id: uid('o_'),
      orderNo: 'TG-' + new Date().getFullYear() + '-' + Math.floor(100000 + Math.random()*900000),
      storeId: s.id,
      items: cart.map(i => ({ ...i })),
      customer: {
        name: data.name.trim(), mobile: data.mobile.trim(), address: data.address.trim(),
        city: data.city.trim(), state: data.state.trim(), pin: data.pin.trim()
      },
      total: cart.reduce((a,i) => a + i.price * i.qty, 0),
      paymentMethod: 'COD',
      paymentStatus: 'Pending',
      status: 'Pending',
      createdAt: now()
    };
    db.set('orders', [...orders(), order]);
    setCart(s.id, []);
    location.hash = '#/order/' + order.id;
    toast('Order placed successfully');
    return;
  }
});

/* drag & drop + file input for product images */
document.addEventListener('change', async e => {
  if (e.target.id !== 'fileInput') return;
  await handleFiles(e.target.files);
  e.target.value = '';
});
async function handleFiles(files){
  const list = [...files].filter(f => f.type.startsWith('image/')).slice(0, 3 - draft.images.length);
  if (!list.length) return;
  for (const f of list){
    try { draft.images.push(await fileToDataURL(f)); }
    catch(err){ toast('Could not read that image'); }
  }
  const box = document.getElementById('thumbs');
  if (box) box.innerHTML = thumbsHtml(draft.images);
}
document.addEventListener('click', e => {
  const drop = e.target.closest('#drop');
  if (drop) document.getElementById('fileInput')?.click();
});
document.addEventListener('dragover', e => {
  const drop = e.target.closest('#drop');
  if (drop){ e.preventDefault(); drop.classList.add('over'); }
});
document.addEventListener('dragleave', e => {
  const drop = e.target.closest('#drop');
  if (drop) drop.classList.remove('over');
});
document.addEventListener('drop', async e => {
  const drop = e.target.closest('#drop');
  if (!drop) return;
  e.preventDefault(); drop.classList.remove('over');
  await handleFiles(e.dataTransfer.files);
});

/* ============================================================
   ROUTER
   ============================================================ */
function render(){
  const raw = location.hash.slice(1) || '/';
  const [path, qs] = raw.split('?');
  const seg = path.split('/').filter(Boolean);
  const user = currentUser();
  let html = '';

  if (seg.length === 0) html = viewHome();
  else if (seg[0] === 'features') html = viewFeatures();
  else if (seg[0] === 'pricing') html = viewPricing();
  else if (seg[0] === 'about') html = viewAbout();
  else if (seg[0] === 'contact') html = viewContact();
  else if (seg[0] === 'privacy') html = viewLegal('privacy');
  else if (seg[0] === 'terms') html = viewLegal('terms');
  else if (seg[0] === 'login') html = user ? (location.hash = '#/dashboard', '') : viewLogin();
  else if (seg[0] === 'signup') html = user ? (location.hash = '#/dashboard', '') : viewSignup();
  else if (seg[0] === 'forgot') html = viewForgot();
  else if (seg[0] === 'admin') html = viewAdmin();

  else if (seg[0] === 'dashboard'){
    if (!user){ location.hash = '#/login'; return; }
    const tab = seg[1] || 'overview';
    if (tab === 'overview') html = viewOverview();
    else if (tab === 'add') html = viewAddProduct();
    else if (tab === 'products') html = viewProducts();
    else if (tab === 'orders') html = viewOrders();
    else if (tab === 'store') html = viewMyStore();
    else if (tab === 'settings') html = viewSettings();
    else html = viewOverview();
  }

  else if (seg[0] === 'store' && seg[1]){
    if (seg[2] === 'p' && seg[3]) html = viewProduct(seg[1], seg[3]);
    else html = viewStore(seg[1]);
  }
  else if (seg[0] === 'cart' && seg[1]) html = viewCart(seg[1]);
  else if (seg[0] === 'checkout' && seg[1]) html = viewCheckout(seg[1]);
  else if (seg[0] === 'order' && seg[1]) html = viewOrderConfirmation(seg[1]);
  else if (seg[0] === 'track' && seg[1]) html = viewTrackOrder(seg[1]);

  else html = nav() + '<div class="wrap" style="padding:70px 22px">' + emptyState('Page not found','That link doesn\'t exist.','Back to homepage','#/') + '</div>' + footer();

  document.getElementById('app').innerHTML = html;
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);
seed();
if (!location.hash) location.hash = '#/';
render();
